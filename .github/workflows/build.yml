name: Build
# Triggers:
#   - push to any branch / PR → run all platform builds, upload artifacts
#   - push of a v* tag (e.g. `git tag v1.7.1 && git push --tags`) → run all
#     platform builds AND create a draft GitHub release with the artifacts
#     attached (release job at the bottom of this file).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v3

    - name: Rust Cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y lld autogen libasound2-dev pkg-config make libssl-dev gcc g++ curl wget git libwebkit2gtk-4.1-dev

    - name: Install NodeJS
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Build
      run: |
        cd client
        pnpm i
        pnpm run build
        cd ..
        cargo update
        cargo build --release

    - name: Bundle
      run: |
        tar zcf DigTrax-linux.tar.gz -C target/release digtrax
        tar zcf DigTrax-linux-cli.tar.gz -C target/release digtrax-cli
        mkdir dist
        mv DigTrax-linux.tar.gz dist/
        mv DigTrax-linux-cli.tar.gz dist/

    - name: Upload Linux
      uses: actions/upload-artifact@v4
      with:
        name: digtrax-linux
        path: dist/DigTrax-linux.tar.gz

    - name: Upload Linux CLI
      uses: actions/upload-artifact@v4
      with:
        name: digtrax-linux-cli
        path: dist/DigTrax-linux-cli.tar.gz


  build-win:
    name: Windows
    runs-on: windows-2022
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Rust Cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install NodeJS
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Install Dependencies
      run: |
        choco install nsis -y
        rustup update

    - name: Build
      run: |
        cd client
        pnpm i
        pnpm run build
        cd ..
        cargo update
        cargo build --release
        
    - name: Bundle
      run: |
        mkdir dist
        powershell -command "(new-object System.Net.WebClient).DownloadFile('https://aka.ms/vs/16/release/vc_redist.x64.exe','vc_redist.x64.exe')"
        powershell -command "(new-object System.Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/p/?LinkId=2124703','MicrosoftEdgeWebview2Setup.exe')"
        &'C:\Program Files (x86)\NSIS\makensis.exe' 'assets\installer.nsi'
        copy target\release\digtrax.exe dist\DigTrax-windows.exe
        copy target\release\digtrax-cli.exe dist\DigTrax-windows-cli.exe

    - name: Upload Archive
      uses: actions/upload-artifact@v4
      with:
        name: digtrax-win
        path: |
          dist/DigTrax-windows.exe

    - name: Upload Archive
      uses: actions/upload-artifact@v4
      with:
        name: digtrax-win-setup
        path: dist/DigTrax-windows-setup.exe

    - name: Upload CLI
      uses: actions/upload-artifact@v4
      with:
        name: digtrax-win-cli
        path: |
          dist/DigTrax-windows-cli.exe

  build-mac:
    name: Mac (Universal)
    runs-on: macos-14

    steps:

    - name: Checkout
      uses: actions/checkout@v3

    - name: Rust Cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-universal-${{ hashFiles('**/Cargo.lock') }}

    - name: Install dependencies
      run: |
        brew install pnpm
        rustup install stable
        rustup target add x86_64-apple-darwin aarch64-apple-darwin
        cargo install cargo-bundle --version 0.6.1 --locked || true

    - name: Build frontend
      run: |
        cd client
        pnpm i
        pnpm run build

    - name: Build both Rust targets
      run: |
        cargo update
        cargo build --release --target aarch64-apple-darwin
        cargo build --release --target x86_64-apple-darwin

    - name: Lipo universal binaries
      run: |
        mkdir -p target/release
        lipo -create -output target/release/digtrax \
          target/aarch64-apple-darwin/release/digtrax \
          target/x86_64-apple-darwin/release/digtrax
        lipo -create -output target/release/digtrax-cli \
          target/aarch64-apple-darwin/release/digtrax-cli \
          target/x86_64-apple-darwin/release/digtrax-cli

    - name: Bundle .app + replace inner binary with universal
      run: |
        # cargo-bundle only builds for the host arch; we overwrite the inner binary
        # with the lipo'd universal one so the .app runs natively on both Intel + Apple Silicon.
        cargo bundle --release
        lipo -create -output target/release/bundle/osx/DigTrax.app/Contents/MacOS/digtrax \
          target/aarch64-apple-darwin/release/digtrax \
          target/x86_64-apple-darwin/release/digtrax
        chmod +x target/release/bundle/osx/DigTrax.app/Contents/MacOS/digtrax
        # Sanity check
        lipo -info target/release/bundle/osx/DigTrax.app/Contents/MacOS/digtrax

    - name: Ad-hoc codesign
      run: |
        codesign --force --deep -s - target/release/bundle/osx/DigTrax.app
        codesign --force -s - target/release/digtrax-cli

    - name: Package
      run: |
        mkdir dist
        cd target/release/bundle/osx
        zip -r DigTrax-mac.zip .
        cd -
        cd target/release
        chmod +x digtrax-cli
        zip DigTrax-mac-cli.zip digtrax-cli
        cd -
        mv target/release/bundle/osx/DigTrax-mac.zip dist/
        mv target/release/DigTrax-mac-cli.zip dist/

    - name: Upload Mac
      uses: actions/upload-artifact@v4
      with:
        name: digtrax-mac
        path: dist/DigTrax-mac.zip

    - name: Upload Mac CLI
      uses: actions/upload-artifact@v4
      with:
        name: digtrax-mac-cli
        path: dist/DigTrax-mac-cli.zip


  # Release job — runs ONLY on tag pushes (refs/tags/v*). Pulls every
  # platform build's artifact and attaches them to a draft GitHub release
  # named after the tag. Drafts so a maintainer can review + edit the
  # release notes before publishing.
  release:
    name: Release
    needs: [build-linux, build-win, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download all platform artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Show downloaded layout
      run: |
        echo "=== dist/ tree ==="
        find dist -maxdepth 3 -type f | sort

    - name: Create draft release
      uses: softprops/action-gh-release@v2
      with:
        name: DigTrax ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: true
        generate_release_notes: true
        body: |
          ## DigTrax ${{ github.ref_name }}

          Cross-platform music metadata tagger for DJs.

          ### Downloads

          | Platform | File |
          | --- | --- |
          | macOS (Universal — Intel + Apple Silicon) | `DigTrax-mac.zip` |
          | macOS CLI | `DigTrax-mac-cli.zip` |
          | Windows installer | `DigTrax-windows-setup.exe` |
          | Windows portable | `DigTrax-windows.exe` |
          | Windows CLI | `DigTrax-windows-cli.exe` |
          | Linux | `DigTrax-linux.tar.gz` |
          | Linux CLI | `DigTrax-linux-cli.tar.gz` |

          See the auto-generated changelog below for what landed in this release.
        files: |
          dist/digtrax-linux/DigTrax-linux.tar.gz
          dist/digtrax-linux-cli/DigTrax-linux-cli.tar.gz
          dist/digtrax-mac/DigTrax-mac.zip
          dist/digtrax-mac-cli/DigTrax-mac-cli.zip
          dist/digtrax-win/DigTrax-windows.exe
          dist/digtrax-win-cli/DigTrax-windows-cli.exe
          dist/digtrax-win-setup/DigTrax-windows-setup.exe
        fail_on_unmatched_files: false

