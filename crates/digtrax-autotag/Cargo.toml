[package]
name = "digtrax-autotag"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4"
rand = "0.9"
regex = "1.11"
dunce = "1.0"
image = "0.25"
anyhow = "1.0"
chrono = "0.4"
base64 = "0.22"
execute = "0.2"
walkdir = "2.5"
libloading = "0.8"
serde_json = "1.0"
lazy_static = "1.5"
crossbeam-channel = "0.5"

serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", features = [
    "json",
    "blocking",
    "rustls-tls",
], default-features = false }

songrec = { git = "https://github.com/Marekkon5/SongRec.git" }

digtrax-tag = { path = "../digtrax-tag" }
digtrax-tagger = { path = "../digtrax-tagger" }
digtrax-player = { path = "../digtrax-player" }
digtrax-shared = { path = "../digtrax-shared" }
digtrax-renamer = { path = "../digtrax-renamer" }
digtrax-platforms = { path = "../digtrax-platforms" }
