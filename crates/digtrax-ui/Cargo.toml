[package]
name = "digtrax-ui"
version = "0.1.0"
edition = "2021"


[dependencies]
log = "0.4"
mime = "0.3"
dunce = "1.0"
trash = "5.2"
image = "0.25"
anyhow = "1.0"
opener = "0.8"
base64 = "0.22"
walkdir = "2.5"
serde_json = "1.0"
webbrowser = "1.0"
mime_guess = "2.0"
urlencoding = "2.1"
include_dir = "0.7"
directories = "6.0"
tinyfiledialogs = "3.9"

axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.45", features = ["rt-multi-thread"] }

digtrax-tag = { path = "../digtrax-tag" }
digtrax-shared = { path = "../digtrax-shared" }
digtrax-tagger = { path = "../digtrax-tagger" }
digtrax-player = { path = "../digtrax-player" }
digtrax-autotag = { path = "../digtrax-autotag" }
digtrax-renamer = { path = "../digtrax-renamer" }
digtrax-playlist = { path = "../digtrax-playlist" }
digtrax-platforms = { path = "../digtrax-platforms" }

# Windows specific 
[target.'cfg(windows)'.dependencies]
sysinfo = "0.35"
