<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg4a" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#0e131e"/><stop offset="100%" stop-color="#050811"/></radialGradient>
    <filter id="glow4a" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glowSm4a" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg4a)"/>
  <!-- ambient -->
  <circle cx="256" cy="256" r="180" fill="#00D2BF" opacity="0.06" filter="url(#glow4a)"/>
  <!-- inner ring -->
  <circle cx="256" cy="256" r="74" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- center spindle -->
  <circle cx="256" cy="256" r="14" fill="#00D2BF" filter="url(#glowSm4a)"/>
  <circle cx="256" cy="256" r="9" fill="#ffffff"/>
  <circle cx="256" cy="256" r="3" fill="#050811"/>

  <!-- 24 flowing curved rays - each curls slightly so the wheel reads as in motion -->
  <g transform="translate(256 256)" stroke-linecap="round" fill="none">
    <!-- white rays with curl (all bow the same direction so spinning looks fluid) -->
    <g stroke="#ffffff" stroke-width="6" opacity="0.88">
      <path d="M 0 -86 Q -10 -118 -8 -148" transform="rotate(0)"/>
      <path d="M 0 -86 Q -8 -114 -7 -140" transform="rotate(15)"/>
      <path d="M 0 -86 Q -6 -108 -5 -128" transform="rotate(30)"/>
      <path d="M 0 -86 Q -5 -104 -4 -120" transform="rotate(45)"/>
      <path d="M 0 -86 Q -7 -110 -6 -132" transform="rotate(60)"/>
      <path d="M 0 -86 Q -9 -118 -8 -146" transform="rotate(75)"/>
      <path d="M 0 -86 Q -11 -125 -10 -158" transform="rotate(105)"/>
      <path d="M 0 -86 Q -10 -120 -9 -150" transform="rotate(120)"/>
      <path d="M 0 -86 Q -8 -112 -7 -138" transform="rotate(135)"/>
      <path d="M 0 -86 Q -6 -106 -5 -126" transform="rotate(150)"/>
      <path d="M 0 -86 Q -8 -114 -7 -138" transform="rotate(165)"/>
      <path d="M 0 -86 Q -10 -120 -9 -148" transform="rotate(180)"/>
      <path d="M 0 -86 Q -9 -116 -8 -142" transform="rotate(195)"/>
      <path d="M 0 -86 Q -7 -110 -6 -130" transform="rotate(210)"/>
      <path d="M 0 -86 Q -5 -104 -4 -120" transform="rotate(225)"/>
      <path d="M 0 -86 Q -7 -110 -6 -132" transform="rotate(240)"/>
      <path d="M 0 -86 Q -9 -118 -8 -146" transform="rotate(255)"/>
      <path d="M 0 -86 Q -11 -125 -10 -158" transform="rotate(285)"/>
      <path d="M 0 -86 Q -10 -120 -9 -150" transform="rotate(300)"/>
      <path d="M 0 -86 Q -8 -114 -7 -138" transform="rotate(315)"/>
      <path d="M 0 -86 Q -7 -110 -6 -130" transform="rotate(330)"/>
      <path d="M 0 -86 Q -8 -114 -7 -140" transform="rotate(345)"/>
    </g>
    <!-- cyan accent peaks at top & bottom (90° and 270°) with surrounding boost -->
    <g stroke="#00D2BF" stroke-width="7" filter="url(#glow4a)" opacity="0.7">
      <path d="M 0 -86 Q -12 -130 -11 -164" transform="rotate(90)"/>
      <path d="M 0 -86 Q -12 -130 -11 -164" transform="rotate(270)"/>
    </g>
    <g stroke="#00D2BF" stroke-width="6">
      <path d="M 0 -86 Q -12 -130 -11 -164" transform="rotate(90)"/>
      <path d="M 0 -86 Q -12 -130 -11 -164" transform="rotate(270)"/>
    </g>
  </g>
</svg>
