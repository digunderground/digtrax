<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgA" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#0e131e"/><stop offset="100%" stop-color="#050811"/></radialGradient>
    <linearGradient id="waveA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D2BF" stop-opacity="0.6"/>
      <stop offset="40%"  stop-color="#1ee5d2" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#1ee5d2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00D2BF" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glowA" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glowSmA" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgA)"/>

  <!-- ambient -->
  <circle cx="256" cy="256" r="180" fill="#00D2BF" opacity="0.07" filter="url(#glowA)"/>

  <!-- grooves -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <circle cx="256" cy="256" r="172" opacity="0.18"/>
    <circle cx="256" cy="256" r="138" opacity="0.22"/>
    <circle cx="256" cy="256" r="104" opacity="0.18"/>
    <circle cx="256" cy="256" r="68"  opacity="0.22"/>
  </g>
  <circle cx="256" cy="256" r="138" fill="none" stroke="#00D2BF" stroke-width="6" opacity="0.55" filter="url(#glowA)"/>
  <circle cx="256" cy="256" r="138" fill="none" stroke="#00D2BF" stroke-width="3.5"/>

  <!-- spindle -->
  <circle cx="256" cy="256" r="18" fill="#00D2BF" filter="url(#glowSmA)"/>
  <circle cx="256" cy="256" r="11" fill="#ffffff"/>
  <circle cx="256" cy="256" r="4" fill="#050811"/>

  <!-- TAG with slightly rounded corners (radius 4) -->
  <g transform="translate(376 256)">
    <path d="M -42 0 L -20 -30 Q -16 -33 -12 -33 L 54 -33 Q 58 -33 58 -29 L 58 29 Q 58 33 54 33 L -12 33 Q -16 33 -20 30 Z"
          fill="#00D2BF" opacity="0.40" filter="url(#glowSmA)"/>
    <path d="M -42 0 L -20 -30 Q -16 -33 -12 -33 L 54 -33 Q 58 -33 58 -29 L 58 29 Q 58 33 54 33 L -12 33 Q -16 33 -20 30 Z"
          fill="#ffffff" stroke="rgba(0,0,0,0.30)" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- WAVEFORM A — DUAL-PEAK CRESCENDO (primary peak + secondary peak) -->
    <!-- glow -->
    <path d="M -8 0 C -4 -2, 0 -4, 4 -8 C 8 -12, 12 -16, 14 -20 C 16 -24, 20 -22, 22 -16 C 24 -10, 26 -4, 28 -2 C 30 0, 32 -4, 34 -10 C 36 -14, 38 -12, 40 -8 C 42 -4, 46 -2, 48 -1 C 50 0, 51 0, 52 0"
          fill="none" stroke="#00D2BF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowA)" opacity="0.6"/>
    <!-- dark backing for crispness on white -->
    <path d="M -8 0 C -4 -2, 0 -4, 4 -8 C 8 -12, 12 -16, 14 -20 C 16 -24, 20 -22, 22 -16 C 24 -10, 26 -4, 28 -2 C 30 0, 32 -4, 34 -10 C 36 -14, 38 -12, 40 -8 C 42 -4, 46 -2, 48 -1 C 50 0, 51 0, 52 0"
          fill="none" stroke="#050811" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <!-- main stroke -->
    <path d="M -8 0 C -4 -2, 0 -4, 4 -8 C 8 -12, 12 -16, 14 -20 C 16 -24, 20 -22, 22 -16 C 24 -10, 26 -4, 28 -2 C 30 0, 32 -4, 34 -10 C 36 -14, 38 -12, 40 -8 C 42 -4, 46 -2, 48 -1 C 50 0, 51 0, 52 0"
          fill="none" stroke="url(#waveA)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
