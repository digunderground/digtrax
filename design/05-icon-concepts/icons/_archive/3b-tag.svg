<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg3b" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0e131e"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="tag3b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222a3d"/>
      <stop offset="100%" stop-color="#161c2c"/>
    </linearGradient>
    <filter id="glow3b" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg3b)"/>

  <!-- tag string/loop -->
  <path d="M 256 80 Q 220 100 256 130" fill="none" stroke="#7a8090" stroke-width="3" stroke-linecap="round"/>
  <path d="M 256 80 Q 292 100 256 130" fill="none" stroke="#7a8090" stroke-width="3" stroke-linecap="round"/>

  <!-- Tag body: pentagon-ish with point at top -->
  <path d="M 256 130
           L 410 200
           L 410 408
           Q 410 432 386 432
           L 126 432
           Q 102 432 102 408
           L 102 200 Z"
        fill="url(#tag3b)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Hole (eyelet) at top -->
  <circle cx="256" cy="158" r="20" fill="#050811"/>
  <circle cx="256" cy="158" r="20" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <circle cx="256" cy="158" r="14" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <!-- Cyan accent stripe -->
  <rect x="102" y="218" width="308" height="10" fill="#00D2BF" opacity="0.5" filter="url(#glow3b)"/>
  <rect x="102" y="218" width="308" height="10" fill="#00D2BF"/>

  <!-- Mini waveform inside tag -->
  <g transform="translate(256 320)">
    <g fill="#ffffff">
      <rect x="-130" y="-6"  width="6" height="12" rx="1.5" opacity="0.5"/>
      <rect x="-114" y="-14" width="6" height="28" rx="1.5" opacity="0.7"/>
      <rect x="-98"  y="-22" width="6" height="44" rx="1.5"/>
      <rect x="-82"  y="-32" width="6" height="64" rx="1.5"/>
      <rect x="-66"  y="-46" width="6" height="92" rx="1.5"/>
    </g>
    <g>
      <rect x="-50" y="-58" width="6" height="116" rx="1.5" fill="#00D2BF" filter="url(#glow3b)"/>
      <rect x="-50" y="-58" width="6" height="116" rx="1.5" fill="#00D2BF"/>
      <rect x="-34" y="-50" width="6" height="100" rx="1.5" fill="#00D2BF" filter="url(#glow3b)"/>
      <rect x="-34" y="-50" width="6" height="100" rx="1.5" fill="#00D2BF"/>
      <rect x="-18" y="-38" width="6" height="76" rx="1.5" fill="#00D2BF"/>
    </g>
    <g fill="#ffffff">
      <rect x="-2"  y="-46" width="6" height="92" rx="1.5"/>
      <rect x="14"  y="-32" width="6" height="64" rx="1.5"/>
      <rect x="30"  y="-22" width="6" height="44" rx="1.5"/>
      <rect x="46"  y="-14" width="6" height="28" rx="1.5" opacity="0.7"/>
      <rect x="62"  y="-6"  width="6" height="12" rx="1.5" opacity="0.5"/>
    </g>
  </g>

  <!-- ID code -->
  <g font-family="monospace" font-size="14" fill="#7a8090" letter-spacing="2">
    <text x="256" y="404" text-anchor="middle">[ DT-001 ]</text>
  </g>
</svg>
