<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgCs" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#0e131e"/><stop offset="100%" stop-color="#050811"/></radialGradient>
    <linearGradient id="waveCs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D2BF" stop-opacity="0.6"/>
      <stop offset="35%"  stop-color="#1ee5d2" stop-opacity="1"/>
      <stop offset="65%"  stop-color="#1ee5d2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00D2BF" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glowCs" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glowSmCs" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgCs)"/>

  <!-- ambient -->
  <circle cx="256" cy="256" r="180" fill="#00D2BF" opacity="0.07" filter="url(#glowCs)"/>

  <!-- grooves -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <circle cx="256" cy="256" r="172" opacity="0.18"/>
    <circle cx="256" cy="256" r="138" opacity="0.22"/>
    <circle cx="256" cy="256" r="104" opacity="0.18"/>
    <circle cx="256" cy="256" r="68"  opacity="0.22"/>
  </g>
  <circle cx="256" cy="256" r="138" fill="none" stroke="#00D2BF" stroke-width="6" opacity="0.55" filter="url(#glowCs)"/>
  <circle cx="256" cy="256" r="138" fill="none" stroke="#00D2BF" stroke-width="3.5"/>

  <!-- spindle -->
  <circle cx="256" cy="256" r="18" fill="#00D2BF" filter="url(#glowSmCs)"/>
  <circle cx="256" cy="256" r="11" fill="#ffffff"/>
  <circle cx="256" cy="256" r="4" fill="#050811"/>

  <!-- LARGE ROUNDED TAG (same as C, +17%) -->
  <g transform="translate(370 256)">
    <path d="M -49 0 L -23 -36 Q -19 -39 -14 -39 L 63 -39 Q 68 -39 68 -34 L 68 34 Q 68 39 63 39 L -14 39 Q -19 39 -23 36 Z"
          fill="#00D2BF" opacity="0.40" filter="url(#glowSmCs)"/>
    <path d="M -49 0 L -23 -36 Q -19 -39 -14 -39 L 63 -39 Q 68 -39 68 -34 L 68 34 Q 68 39 63 39 L -14 39 Q -19 39 -23 36 Z"
          fill="#ffffff" stroke="rgba(0,0,0,0.30)" stroke-width="1.75" stroke-linejoin="round"/>

    <!-- SHARP ENERGETIC WAVE — angular peaks centered in the tag body, stronger amplitudes -->
    <!-- Body center x ≈ 24, tag interior y range ±39. Peak goes to -32 (centered), with sharp climbs/falls. -->
    <path d="M -10 0 L -4 0 L -2 -4 L 2 -2 L 4 -10 L 8 -6 L 10 -18 L 14 -14 L 16 -26 L 18 -18 L 20 -8 L 22 -22 L 24 -32 L 26 -22 L 28 -8 L 30 -18 L 32 -26 L 34 -16 L 38 -18 L 40 -8 L 44 -12 L 46 -2 L 50 -4 L 54 0 L 62 0"
          fill="none" stroke="#00D2BF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCs)" opacity="0.65"/>
    <path d="M -10 0 L -4 0 L -2 -4 L 2 -2 L 4 -10 L 8 -6 L 10 -18 L 14 -14 L 16 -26 L 18 -18 L 20 -8 L 22 -22 L 24 -32 L 26 -22 L 28 -8 L 30 -18 L 32 -26 L 34 -16 L 38 -18 L 40 -8 L 44 -12 L 46 -2 L 50 -4 L 54 0 L 62 0"
          fill="none" stroke="#050811" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.60"/>
    <path d="M -10 0 L -4 0 L -2 -4 L 2 -2 L 4 -10 L 8 -6 L 10 -18 L 14 -14 L 16 -26 L 18 -18 L 20 -8 L 22 -22 L 24 -32 L 26 -22 L 28 -8 L 30 -18 L 32 -26 L 34 -16 L 38 -18 L 40 -8 L 44 -12 L 46 -2 L 50 -4 L 54 0 L 62 0"
          fill="none" stroke="url(#waveCs)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
