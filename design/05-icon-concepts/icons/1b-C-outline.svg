<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgCo" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#0e131e"/><stop offset="100%" stop-color="#050811"/></radialGradient>
    <linearGradient id="waveFillCo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#00D2BF" stop-opacity="0.70"/>
      <stop offset="50%" stop-color="#1ee5d2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00D2BF" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="waveOutlineCo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1ee5d2" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1ee5d2" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glowCo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glowSmCo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgCo)"/>

  <!-- ambient -->
  <circle cx="256" cy="256" r="180" fill="#00D2BF" opacity="0.07" filter="url(#glowCo)"/>

  <!-- grooves -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <circle cx="256" cy="256" r="172" opacity="0.18"/>
    <circle cx="256" cy="256" r="138" opacity="0.22"/>
    <circle cx="256" cy="256" r="104" opacity="0.18"/>
    <circle cx="256" cy="256" r="68"  opacity="0.22"/>
  </g>
  <circle cx="256" cy="256" r="138" fill="none" stroke="#00D2BF" stroke-width="6" opacity="0.55" filter="url(#glowCo)"/>
  <circle cx="256" cy="256" r="138" fill="none" stroke="#00D2BF" stroke-width="3.5"/>

  <!-- spindle -->
  <circle cx="256" cy="256" r="18" fill="#00D2BF" filter="url(#glowSmCo)"/>
  <circle cx="256" cy="256" r="11" fill="#ffffff"/>
  <circle cx="256" cy="256" r="4" fill="#050811"/>

  <!-- LARGER ROUNDED TAG with DUAL-ENVELOPE WAVEFORM (upper + lower mirrored, like a DAW) -->
  <g transform="translate(370 256)">
    <!-- glow halo -->
    <path d="M -49 0 L -23 -36 Q -19 -39 -14 -39 L 63 -39 Q 68 -39 68 -34 L 68 34 Q 68 39 63 39 L -14 39 Q -19 39 -23 36 Z"
          fill="#00D2BF" opacity="0.40" filter="url(#glowSmCo)"/>
    <!-- white tag body -->
    <path d="M -49 0 L -23 -36 Q -19 -39 -14 -39 L 63 -39 Q 68 -39 68 -34 L 68 34 Q 68 39 63 39 L -14 39 Q -19 39 -23 36 Z"
          fill="#ffffff" stroke="rgba(0,0,0,0.30)" stroke-width="1.75" stroke-linejoin="round"/>

    <!-- center axis (subtle dashed line) -->
    <line x1="-10" y1="0" x2="62" y2="0" stroke="rgba(0,0,0,0.15)" stroke-width="1" stroke-dasharray="2,3"/>

    <!-- closed wave fill between upper & lower envelopes (cyan) -->
    <path d="M -10 0 C -7 -3, -4 -8, -1 -14 C 2 -18, 5 -16, 8 -10 C 11 -4, 13 0, 15 -2 C 17 -8, 19 -16, 21 -22 C 23 -26, 26 -24, 28 -18 C 30 -10, 32 -2, 34 -4 C 36 -10, 38 -16, 41 -18 C 44 -16, 47 -10, 50 -4 C 53 -2, 57 -1, 60 0 L 62 0 C 60 0, 57 1, 53 2 C 50 4, 47 10, 44 16 C 41 18, 38 16, 36 10 C 34 4, 32 2, 30 10 C 28 18, 26 24, 23 26 C 21 22, 19 16, 17 8 C 15 2, 13 0, 11 4 C 8 10, 5 16, 2 18 C -1 14, -4 8, -7 3 Z"
          fill="url(#waveFillCo)"/>

    <!-- upper envelope outline -->
    <path d="M -10 0 C -7 -3, -4 -8, -1 -14 C 2 -18, 5 -16, 8 -10 C 11 -4, 13 0, 15 -2 C 17 -8, 19 -16, 21 -22 C 23 -26, 26 -24, 28 -18 C 30 -10, 32 -2, 34 -4 C 36 -10, 38 -16, 41 -18 C 44 -16, 47 -10, 50 -4 C 53 -2, 57 -1, 60 0 L 62 0"
          fill="none" stroke="url(#waveOutlineCo)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowSmCo)"/>
    <path d="M -10 0 C -7 -3, -4 -8, -1 -14 C 2 -18, 5 -16, 8 -10 C 11 -4, 13 0, 15 -2 C 17 -8, 19 -16, 21 -22 C 23 -26, 26 -24, 28 -18 C 30 -10, 32 -2, 34 -4 C 36 -10, 38 -16, 41 -18 C 44 -16, 47 -10, 50 -4 C 53 -2, 57 -1, 60 0 L 62 0"
          fill="none" stroke="url(#waveOutlineCo)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- lower envelope outline (mirrored) -->
    <path d="M -10 0 C -7 3, -4 8, -1 14 C 2 18, 5 16, 8 10 C 11 4, 13 0, 15 2 C 17 8, 19 16, 21 22 C 23 26, 26 24, 28 18 C 30 10, 32 2, 34 4 C 36 10, 38 16, 41 18 C 44 16, 47 10, 50 4 C 53 2, 57 1, 60 0 L 62 0"
          fill="none" stroke="url(#waveOutlineCo)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowSmCo)"/>
    <path d="M -10 0 C -7 3, -4 8, -1 14 C 2 18, 5 16, 8 10 C 11 4, 13 0, 15 2 C 17 8, 19 16, 21 22 C 23 26, 26 24, 28 18 C 30 10, 32 2, 34 4 C 36 10, 38 16, 41 18 C 44 16, 47 10, 50 4 C 53 2, 57 1, 60 0 L 62 0"
          fill="none" stroke="url(#waveOutlineCo)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
